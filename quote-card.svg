<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Big Container Box -->
  <rect x="2" y="2" width="796" height="116" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="2.2" filter="url(#cardShadow)" />

  <!-- Question Section (Bigger, Bolder) -->
  <g transform="translate(32, 32)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" fill="#f8fafc" letter-spacing="0.3px">
      What happens when code runs on the first try?
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="28" y1="58" x2="772" y2="58" stroke="#1e293b" stroke-width="1.5" />

  <!-- Answer Section (Bigger, Bolder) -->
  <g transform="translate(32, 92)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
      <tspan fill="#94a3b8">Ans — </tspan>
      <tspan fill="#f43f5e" font-weight="800">We don't debug it.</tspan>
      <tspan fill="#4ade80" font-weight="900"> We Commit and Push before it Change. 🚀</tspan>
    </text>
  </g>
</svg>
