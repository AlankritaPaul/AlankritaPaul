<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 65" width="100%" height="65">
  <defs>
    <filter id="crispTagDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style><![CDATA[
    /* Monospace Code Font */
    .mono-line {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      filter: url(#crispTagDrop);
    }

    /* Total Cycle: 12s (3s per phrase) */
    @keyframes showPhrase1 {
      0%, 22% { opacity: 1; transform: translateY(0px) scale(1); }
      25%, 97% { opacity: 0; transform: translateY(-12px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0px) scale(1); }
    }

    @keyframes showPhrase2 {
      0%, 22% { opacity: 0; transform: translateY(12px) scale(0.96); }
      25%, 47% { opacity: 1; transform: translateY(0px) scale(1); }
      50%, 100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    @keyframes showPhrase3 {
      0%, 47% { opacity: 0; transform: translateY(12px) scale(0.96); }
      50%, 72% { opacity: 1; transform: translateY(0px) scale(1); }
      75%, 100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    @keyframes showPhrase4 {
      0%, 72% { opacity: 0; transform: translateY(12px) scale(0.96); }
      75%, 97% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    /* Phrase 1: Monospace in Vibrant Coral Rose (#f43f5e) */
    .phrase-1 {
      font-size: 24px;
      fill: #f43f5e;
      animation: showPhrase1 12s infinite ease-in-out;
    }

    /* Phrase 2: Monospace in Radiant Warm Amber Gold (#fbbf24) */
    .phrase-2 {
      font-size: 24px;
      fill: #fbbf24;
      animation: showPhrase2 12s infinite ease-in-out;
    }

    /* Phrase 3: Monospace in Vivid Emerald Mint (#10b981) */
    .phrase-3 {
      font-size: 24px;
      fill: #10b981;
      animation: showPhrase3 12s infinite ease-in-out;
    }

    /* Phrase 4: Monospace in Electric Neon Cyan (#00f2fe) */
    .phrase-4 {
      font-size: 24px;
      fill: #00f2fe;
      animation: showPhrase4 12s infinite ease-in-out;
    }
  ]]></style>

  <!-- Normal Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Phrase 1: ⚡ Creating my Own Identity (Vibrant Coral Rose #f43f5e) -->
  <text x="450" y="42" text-anchor="middle" class="mono-line phrase-1">
    ⚡ Creating my Own Identity
  </text>

  <!-- Phrase 2: 🏛️ Pursuing AICS @ IIT PATNA (Radiant Amber Gold #fbbf24) -->
  <text x="450" y="42" text-anchor="middle" class="mono-line phrase-2">
    🏛️ Pursuing AICS @ IIT PATNA
  </text>

  <!-- Phrase 3: 🤝 Sponsorship Team Member @ STC, IIT Patna (Vivid Emerald Mint #10b981) -->
  <text x="450" y="42" text-anchor="middle" class="mono-line phrase-3">
    🤝 Sponsorship Team Member @ STC, IIT Patna
  </text>

  <!-- Phrase 4: 💡 From Ideas To Implementation (Electric Neon Cyan #00f2fe) -->
  <text x="450" y="42" text-anchor="middle" class="mono-line phrase-4">
    💡 From Ideas To Implementation
  </text>
</svg>
