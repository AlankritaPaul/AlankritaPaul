<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 65" width="100%" height="65">
  <defs>
    <filter id="crispTagDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Orbitron:wght@700&family=Cinzel:wght@800&display=swap');

    /* Total Cycle: 9s (3s per phrase) */
    @keyframes showPhrase1 {
      0%, 30% { opacity: 1; transform: translateY(0px) scale(1); }
      33%, 97% { opacity: 0; transform: translateY(-12px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0px) scale(1); }
    }

    @keyframes showPhrase2 {
      0%, 30% { opacity: 0; transform: translateY(12px) scale(0.96); }
      33%, 63% { opacity: 1; transform: translateY(0px) scale(1); }
      66%, 100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    @keyframes showPhrase3 {
      0%, 63% { opacity: 0; transform: translateY(12px) scale(0.96); }
      66%, 96% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    /* Phrase 1: Straight, Upright (Righteous) */
    .phrase-1 {
      font-family: 'Righteous', -apple-system, sans-serif;
      font-size: 28px;
      font-style: normal;
      letter-spacing: 3.5px;
      fill: #e11d48;
      filter: url(#crispTagDrop);
      animation: showPhrase1 9s infinite ease-in-out;
    }

    /* Phrase 2: Straight, Upright (Orbitron) */
    .phrase-2 {
      font-family: 'Orbitron', -apple-system, sans-serif;
      font-size: 25px;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 5px;
      fill: #0284c7;
      filter: url(#crispTagDrop);
      animation: showPhrase2 9s infinite ease-in-out;
    }

    /* Phrase 3: Straight, Upright (Cinzel) */
    .phrase-3 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 25px;
      font-weight: 900;
      font-style: normal;
      letter-spacing: 4.5px;
      fill: #d97706;
      filter: url(#crispTagDrop);
      animation: showPhrase3 9s infinite ease-in-out;
    }
  ]]></style>

  <!-- Normal Transparent Background (No Added Colored Box) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Phrase 1: Creating my Own Identity -->
  <text x="450" y="42" text-anchor="middle" class="phrase-1">
    ⚡ Creating my Own Identity
  </text>

  <!-- Phrase 2: From Ideas To Implementation -->
  <text x="450" y="42" text-anchor="middle" class="phrase-2">
    💡 From Ideas To Implementation
  </text>

  <!-- Phrase 3: Pursuing AICS @ IIT PATNA -->
  <text x="450" y="42" text-anchor="middle" class="phrase-3">
    🏛️ Pursuing AICS @ IIT PATNA
  </text>
</svg>
