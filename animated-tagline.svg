<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <!-- Midnight Obsidian / Sapphire Background (Distinct from Bottle Green) -->
    <linearGradient id="midnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c18" />
      <stop offset="50%" stop-color="#0d1b30" />
      <stop offset="100%" stop-color="#07101f" />
    </linearGradient>

    <!-- Electric Cyan to Gold Border Gradient -->
    <linearGradient id="cyanGoldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f6d365" stop-opacity="0.8" />
    </linearGradient>

    <!-- Crisp Text Drop Shadow -->
    <filter id="tagTextShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Orbitron:wght@700&family=Cinzel:wght@800&display=swap');

    /* Total Cycle: 9s (3s per phrase) */
    @keyframes showPhrase1 {
      0%, 30% { opacity: 1; transform: translateY(0px) scale(1); }
      33%, 97% { opacity: 0; transform: translateY(-12px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0px) scale(1); }
    }

    @keyframes showPhrase2 {
      0%, 30% { opacity: 0; transform: translateY(12px) scale(0.96); }
      33%, 63% { opacity: 1; transform: translateY(0px) scale(1); }
      66%, 100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    @keyframes showPhrase3 {
      0%, 63% { opacity: 0; transform: translateY(12px) scale(0.96); }
      66%, 96% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }

    /* Phrase 1: Creating my Own Identity (Crisp Vibrant Rose Pink) */
    .phrase-1 {
      font-family: 'Righteous', -apple-system, sans-serif;
      font-size: 28px;
      letter-spacing: 3.5px;
      fill: #ff6b9d;
      filter: url(#tagTextShadow);
      animation: showPhrase1 9s infinite ease-in-out;
    }

    /* Phrase 2: From Ideas To Implementation (Crisp Electric Cyan) */
    .phrase-2 {
      font-family: 'Orbitron', -apple-system, sans-serif;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #38bdf8;
      filter: url(#tagTextShadow);
      animation: showPhrase2 9s infinite ease-in-out;
    }

    /* Phrase 3: Pursuing AICS @ IIT PATNA (Crisp Radiant Gold) */
    .phrase-3 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4.5px;
      fill: #fde047;
      filter: url(#tagTextShadow);
      animation: showPhrase3 9s infinite ease-in-out;
    }
  ]]></style>

  <!-- Midnight Obsidian / Sapphire Background Box (Distinct from Bottle Green Box) -->
  <rect x="2" y="2" width="896" height="76" rx="14" fill="url(#midnightBg)" stroke="url(#cyanGoldBorder)" stroke-width="2" />

  <!-- Phrase 1: Creating my Own Identity -->
  <text x="450" y="50" text-anchor="middle" class="phrase-1">
    ⚡ Creating my Own Identity
  </text>

  <!-- Phrase 2: From Ideas To Implementation -->
  <text x="450" y="50" text-anchor="middle" class="phrase-2">
    💡 From Ideas To Implementation
  </text>

  <!-- Phrase 3: Pursuing AICS @ IIT PATNA -->
  <text x="450" y="50" text-anchor="middle" class="phrase-3">
    🏛️ Pursuing AICS @ IIT PATNA
  </text>
</svg>
