<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Elegant Gold Text Gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Infinity Golden Gradient -->
    <linearGradient id="infinityGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bottom Accent Divider Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="crispDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fredoka:wght@600;700&display=swap');

    /* 1. Name: Dream Highway Font */
    .name-title {
      font-family: 'Dream Highway', 'DreamHighway', 'DM Serif Display', 'Playfair Display', Georgia, serif;
      font-size: 78px;
      font-weight: 800;
      font-style: normal;
      fill: url(#textGold);
      filter: url(#crispDrop);
      letter-spacing: 4px;
    }

    /* 2. Subtitles Below Name: Brownie Font */
    .title-different {
      font-family: 'Brownie', 'Brownie Sans', 'CS Brownie', 'Fredoka', -apple-system, sans-serif;
      font-size: 22px;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 8px;
      text-transform: uppercase;
      fill: #0284c7;
      filter: url(#crispDrop);
    }

    .title-code {
      font-family: 'Brownie', 'Brownie Sans', 'CS Brownie', 'Fredoka', -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 6px;
      text-transform: uppercase;
      fill: #d97706;
      filter: url(#crispDrop);
    }

    /* Animated Gold Infinity */
    @keyframes infinityFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -180; }
    }
    @keyframes infinityPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #f59e0b); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 8px #fbbf24); }
    }
    .golden-infinity {
      stroke-dasharray: 22 7;
      animation: infinityFlow 2.8s linear infinite, infinityPulse 3s ease-in-out infinite;
      transform-origin: 0 0;
    }

    /* Sparkles */
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .sparkle { animation: twinkle 3s infinite ease-in-out; }
    .sparkle-delay { animation: twinkle 3s infinite ease-in-out 1.5s; }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .content-group {
      animation: gentleFloat 6s ease-in-out infinite;
    }
  ]]></style>

  <!-- Normal Transparent Background -->
  <rect x="0" y="0" width="900" height="240" fill="none" />

  <g class="content-group">
    <!-- Star Sparkles -->
    <g transform="translate(130, 60)" class="sparkle">
      <path d="M 0 -13 Q 0 0 13 0 Q 0 0 0 13 Q 0 0 -13 0 Q 0 0 0 -13 Z" fill="#f59e0b" />
    </g>
    <g transform="translate(770, 62)" class="sparkle-delay">
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="#0284c7" />
    </g>
    <g transform="translate(210, 32)" class="sparkle-delay">
      <circle cx="0" cy="0" r="3" fill="#f59e0b" />
    </g>
    <g transform="translate(690, 35)" class="sparkle">
      <circle cx="0" cy="0" r="3" fill="#0284c7" />
    </g>

    <!-- 1. Name: Dream Highway Font -->
    <text x="450" y="90" text-anchor="middle" class="name-title">Alankrita Paul</text>

    <!-- 2. Gold Accent Swash -->
    <path d="M 240 108 C 340 118, 400 112, 450 110 C 500 108, 560 118, 660 108 C 600 113, 500 111, 450 111 C 400 111, 300 113, 240 108 Z" fill="url(#textGold)" opacity="0.9" />

    <!-- 3. Animated Golden Infinity Symbol -->
    <g transform="translate(450, 138)">
      <path d="M 0 0 C 18 -20, 46 -20, 46 0 C 46 20, 18 20, 0 0 C -18 -20, -46 -20, -46 0 C -46 20, -18 20, 0 0 Z"
            fill="none"
            stroke="url(#infinityGold)"
            stroke-width="4.5"
            stroke-linecap="round"
            class="golden-infinity" />
      <circle cx="0" cy="0" r="2.5" fill="#f59e0b" />
    </g>

    <!-- 4. "MADE TO BE DIFFERENT" in Brownie Font -->
    <text x="450" y="186" text-anchor="middle" class="title-different">MADE TO BE DIFFERENT</text>

    <!-- 5. "CODE • CURIOSITY • CONTINUOUS LEARNING" in Brownie Font -->
    <text x="450" y="216" text-anchor="middle" class="title-code">
      CODE <tspan fill="#0284c7">✦</tspan> CURIOSITY <tspan fill="#0284c7">✦</tspan> CONTINUOUS LEARNING
    </text>
  </g>

  <!-- Bottom Accent Divider Line -->
  <line x1="120" y1="234" x2="780" y2="234" stroke="url(#lineGrad)" stroke-width="1.8" />
</svg>