<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Righteous&family=Cinzel:wght@700;800&display=swap');

      /* 1. Name: Luxury Calligraphy */
      .calligraphy-name {
        font-family: 'Great Vibes', 'Alex Brush', 'Dancing Script', cursive;
        font-size: 96px;
        font-weight: 400;
        fill: url(#goldGrad);
        filter: url(#nameGlow);
        letter-spacing: 2.5px;
      }

      /* 2. Made To Be Different: Modern Futuristic Distinct Style & Electric Neon Cyan-Purple Color */
      .title-different {
        font-family: 'Righteous', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 25px;
        letter-spacing: 9px;
        text-transform: uppercase;
        fill: url(#neonCyanPurple);
        filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.6));
      }

      /* 3. Code Curiosity Continuous Learning: Luxury Roman Serif Style & Radiant Sunset Peach Color */
      .title-code {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 6.5px;
        text-transform: uppercase;
        fill: url(#sunsetCoral);
        filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.5));
      }

      /* Animated Golden Infinity */
      @keyframes infinityFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes infinityPulse {
        0%, 100% {
          filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 14px rgba(245, 158, 11, 0.85));
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 0 14px #fff5b8) drop-shadow(0 0 28px rgba(251, 191, 36, 1));
          transform: scale(1.15);
        }
      }
      .golden-infinity {
        stroke-dasharray: 24 8;
        animation: infinityFlow 2.8s linear infinite, infinityPulse 3s ease-in-out infinite;
        transform-origin: 0 0;
      }

      /* Ambient Twinkling Stars */
      .sparkle { animation: twinkle 3s infinite ease-in-out; }
      .sparkle-delay { animation: twinkle 3s infinite ease-in-out 1.5s; }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .banner-group {
        animation: floatSoft 6s ease-in-out infinite;
      }
    ]]></style>

    <!-- Metallic 24K Gold Gradient for Calligraphy Name -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="25%" stop-color="#f6d365" />
      <stop offset="65%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <!-- Golden Infinity Gradient -->
    <linearGradient id="infinityGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Distinct Color 1: Electric Neon Cyan to Magenta -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Distinct Color 2: Luminous Sunset Coral to Peach -->
    <linearGradient id="sunsetCoral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd269" />
      <stop offset="50%" stop-color="#ff9a8b" />
      <stop offset="100%" stop-color="#ff6a88" />
    </linearGradient>

    <!-- Bottom Border Accent Gradient -->
    <linearGradient id="borderAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="80%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Background Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <filter id="nameGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#f6d365" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Light -->
  <rect x="0" y="0" width="900" height="280" fill="transparent" />
  <ellipse cx="450" cy="140" rx="420" ry="120" fill="url(#ambientGlow)" />

  <g class="banner-group">
    <!-- Star Sparkles -->
    <g transform="translate(130, 72)" class="sparkle">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#ffd700" />
    </g>
    <g transform="translate(770, 76)" class="sparkle-delay">
      <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#00f2fe" />
    </g>
    <g transform="translate(220, 42)" class="sparkle-delay">
      <circle cx="0" cy="0" r="3.5" fill="#f43f5e" />
    </g>
    <g transform="translate(680, 46)" class="sparkle">
      <circle cx="0" cy="0" r="3.5" fill="#fde047" />
    </g>

    <!-- 1. Name in Luxury Calligraphy (Enlarged) -->
    <text x="450" y="102" text-anchor="middle" class="calligraphy-name">Alankrita Paul</text>

    <!-- 2. Calligraphy Swash Flourish -->
    <path d="M 230 124 C 330 137, 390 127, 450 125 C 510 123, 570 137, 670 124 C 610 130, 510 127, 450 126 C 390 127, 290 130, 230 124 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- 3. Animated Golden Colour Infinity (Centered prominently below name) -->
    <g transform="translate(450, 154)">
      <path d="M 0 0 C 18 -20, 48 -20, 48 0 C 48 20, 18 20, 0 0 C -18 -20, -48 -20, -48 0 C -48 20, -18 20, 0 0 Z"
            fill="none"
            stroke="url(#infinityGold)"
            stroke-width="4.5"
            stroke-linecap="round"
            class="golden-infinity" />
      <circle cx="0" cy="0" r="3" fill="#fffbeb" />
    </g>

    <!-- 4. "MADE TO BE DIFFERENT" - Distinct Modern Futuristic Style & Vibrant Cyan/Pink Color -->
    <text x="450" y="210" text-anchor="middle" class="title-different">MADE TO BE DIFFERENT</text>

    <!-- 5. "CODE • CURIOSITY • CONTINUOUS LEARNING" - Distinct Roman Serif Style & Radiant Coral Color -->
    <text x="450" y="245" text-anchor="middle" class="title-code">
      CODE <tspan fill="#ffd700">✦</tspan> CURIOSITY <tspan fill="#ffd700">✦</tspan> CONTINUOUS LEARNING
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="80" y1="272" x2="820" y2="272" stroke="url(#borderAccent)" stroke-width="2.5" />
</svg>
