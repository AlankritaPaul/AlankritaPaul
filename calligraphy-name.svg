<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <!-- Luxury Deep Bottle Green Gradients -->
    <linearGradient id="bottleGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041812" />
      <stop offset="50%" stop-color="#0b2c21" />
      <stop offset="100%" stop-color="#061f18" />
    </linearGradient>

    <!-- Elegant Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#f6d365" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fff1be" stop-opacity="1" />
      <stop offset="75%" stop-color="#f6d365" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.3" />
    </linearGradient>

    <!-- 24K Gold Text Gradient (High Contrast) -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle, Crisp Drop Shadow (No Deep Muddy Blur) -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Righteous&family=Cinzel:wght@700;800&display=swap');

    /* 1. Calligraphy Name: Crisp, High-Contrast Cursive */
    .calligraphy-name {
      font-family: 'Brush Script MT', 'Segoe Script', 'Great Vibes', 'Dancing Script', cursive;
      font-size: 94px;
      font-weight: 700;
      fill: url(#textGold);
      filter: url(#crispShadow);
      letter-spacing: 2px;
    }

    /* 2. Made To Be Different: Crisp Modern Display */
    .title-different {
      font-family: 'Righteous', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 24px;
      letter-spacing: 9px;
      text-transform: uppercase;
      fill: #38bdf8;
      filter: url(#crispShadow);
    }

    /* 3. Code Tagline: Crisp Roman Serif */
    .title-code {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      fill: #fef08a;
      filter: url(#crispShadow);
    }

    /* Animated Gold Infinity (Smooth & Clean) */
    @keyframes infinityFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -180; }
    }
    @keyframes infinityPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #fde047); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 10px #fef08a); }
    }
    .golden-infinity {
      stroke-dasharray: 22 7;
      animation: infinityFlow 2.8s linear infinite, infinityPulse 3s ease-in-out infinite;
      transform-origin: 0 0;
    }

    /* Twinkling Star Accents */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    .sparkle { animation: twinkle 3s infinite ease-in-out; }
    .sparkle-delay { animation: twinkle 3s infinite ease-in-out 1.5s; }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .content-group {
      animation: gentleFloat 6s ease-in-out infinite;
    }
  ]]></style>

  <!-- Solid Luxury Bottle Green Card Background -->
  <rect x="2" y="2" width="896" height="296" rx="20" fill="url(#bottleGreenBg)" stroke="url(#goldBorder)" stroke-width="2.5" />

  <!-- Inner Subtle Ambient Accent -->
  <rect x="8" y="8" width="884" height="284" rx="16" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" />

  <g class="content-group">
    <!-- Star Sparkles -->
    <g transform="translate(130, 75)" class="sparkle">
      <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#ffd700" />
    </g>
    <g transform="translate(770, 78)" class="sparkle-delay">
      <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#fde047" />
    </g>
    <g transform="translate(220, 45)" class="sparkle-delay">
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    </g>
    <g transform="translate(680, 48)" class="sparkle">
      <circle cx="0" cy="0" r="3" fill="#34d399" />
    </g>

    <!-- 1. Name in Crisp Luxury Calligraphy -->
    <text x="450" y="108" text-anchor="middle" class="calligraphy-name">Alankrita Paul</text>

    <!-- 2. Calligraphy Swash Flourish -->
    <path d="M 230 130 C 330 142, 390 133, 450 131 C 510 129, 570 142, 670 130 C 610 136, 510 133, 450 132 C 390 133, 290 136, 230 130 Z" fill="url(#textGold)" opacity="0.9" />

    <!-- 3. Animated Golden Infinity Symbol (Centered cleanly) -->
    <g transform="translate(450, 162)">
      <path d="M 0 0 C 18 -20, 46 -20, 46 0 C 46 20, 18 20, 0 0 C -18 -20, -46 -20, -46 0 C -46 20, -18 20, 0 0 Z"
            fill="none"
            stroke="url(#textGold)"
            stroke-width="4.5"
            stroke-linecap="round"
            class="golden-infinity" />
      <circle cx="0" cy="0" r="2.5" fill="#fffbeb" />
    </g>

    <!-- 4. "MADE TO BE DIFFERENT" - High-Contrast Electric Cyan -->
    <text x="450" y="222" text-anchor="middle" class="title-different">MADE TO BE DIFFERENT</text>

    <!-- 5. "CODE • CURIOSITY • CONTINUOUS LEARNING" - High-Contrast Warm Gold -->
    <text x="450" y="258" text-anchor="middle" class="title-code">
      CODE <tspan fill="#34d399">✦</tspan> CURIOSITY <tspan fill="#34d399">✦</tspan> CONTINUOUS LEARNING
    </text>
  </g>
</svg>
