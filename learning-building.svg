<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 50" width="100%" height="50">
  <defs>
    <!-- Luminous Pearlescent Iridescent Shimmer Gradient -->
    <linearGradient id="pearlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="pearlGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@1,600&display=swap');

    /* Pearly Font Styling */
    .pearly-text {
      font-family: 'Pearly', 'Pearly Smiles', 'Dancing Script', 'Playfair Display', cursive, serif;
      font-size: 26px;
      font-style: italic;
      font-weight: 700;
      fill: url(#pearlGrad);
      letter-spacing: 2.5px;
      filter: url(#pearlGlow);
    }
  ]]></style>

  <rect width="100%" height="100%" fill="none" />

  <text x="350" y="33" text-anchor="middle" class="pearly-text">
    "Learning by Building" — Alankrita Paul
  </text>
</svg>
