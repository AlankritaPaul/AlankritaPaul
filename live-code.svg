<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="100%" height="490">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="ideBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Clip Paths for Live Typing Effect -->
    <clipPath id="clipLine1">
      <rect x="70" y="65" width="680" height="36" class="type-rect-1" />
    </clipPath>
    <clipPath id="clipLine2">
      <rect x="70" y="103" width="680" height="36" class="type-rect-2" />
    </clipPath>
    <clipPath id="clipLine3">
      <rect x="70" y="141" width="680" height="36" class="type-rect-3" />
    </clipPath>
    <clipPath id="clipLine4">
      <rect x="70" y="179" width="680" height="36" class="type-rect-4" />
    </clipPath>
    <clipPath id="clipLine5">
      <rect x="70" y="217" width="680" height="36" class="type-rect-5" />
    </clipPath>

    <filter id="ideGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style><![CDATA[
    .code-text {
      font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      font-size: 17.5px;
      letter-spacing: 0.5px;
    }
    .line-num {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 15px;
      fill: #475569;
      user-select: none;
    }
    .output-font {
      font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      letter-spacing: 0.5px;
    }

    /* Total Loop Duration: 14 Seconds (Smooth, natural, comfortably paced) */
    @keyframes type1 {
      0% { transform: scaleX(0); }
      8%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type2 {
      0%, 11% { transform: scaleX(0); }
      21%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type3 {
      0%, 24% { transform: scaleX(0); }
      37%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type4 {
      0%, 40% { transform: scaleX(0); }
      50%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type5 {
      0%, 53% { transform: scaleX(0); }
      66%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }

    .type-rect-1 { transform-origin: 70px 0; animation: type1 14s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-rect-2 { transform-origin: 70px 0; animation: type2 14s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-rect-3 { transform-origin: 70px 0; animation: type3 14s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-rect-4 { transform-origin: 70px 0; animation: type4 14s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-rect-5 { transform-origin: 70px 0; animation: type5 14s infinite cubic-bezier(0.3, 0, 0.2, 1); }

    /* Output Slides Down Gently from Top to Down */
    @keyframes slideDownLine1 {
      0%, 68% {
        opacity: 0;
        transform: translateY(-22px);
      }
      73%, 93% {
        opacity: 1;
        transform: translateY(0);
      }
      97%, 100% {
        opacity: 0;
        transform: translateY(-22px);
      }
    }

    @keyframes slideDownLine2 {
      0%, 77% {
        opacity: 0;
        transform: translateY(-22px);
      }
      82%, 93% {
        opacity: 1;
        transform: translateY(0);
      }
      97%, 100% {
        opacity: 0;
        transform: translateY(-22px);
      }
    }

    .anim-out-1 { animation: slideDownLine1 14s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .anim-out-2 { animation: slideDownLine2 14s infinite cubic-bezier(0.16, 1, 0.3, 1); }

    /* Blinking Terminal Cursor */
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blinkCursor 0.9s infinite;
      fill: #34d399;
    }
  ]]></style>

  <!-- Big Window Container -->
  <rect x="2" y="2" width="796" height="486" rx="18" fill="url(#ideBg)" stroke="url(#ideBorder)" stroke-width="2.5" filter="url(#ideGlow)" />

  <!-- Window Header -->
  <g>
    <!-- macOS Dots -->
    <circle cx="32" cy="28" r="7" fill="#f43f5e" />
    <circle cx="56" cy="28" r="7" fill="#fbbf24" />
    <circle cx="80" cy="28" r="7" fill="#10b981" />

    <!-- Active Tab -->
    <rect x="115" y="12" width="140" height="32" rx="8" fill="#1e293b" />
    <circle cx="134" cy="28" r="4" fill="#38bdf8" />
    <text x="148" y="33" font-family="'Fira Code', monospace" font-size="13.5" font-weight="700" fill="#f1f5f9">main.py</text>

    <!-- Header Status -->
    <text x="760" y="32" text-anchor="end" font-family="'Fira Code', monospace" font-size="12.5" font-weight="600" fill="#64748b">PYTHON 3.11</text>
  </g>

  <!-- Header Divider -->
  <line x1="2" y1="52" x2="798" y2="52" stroke="#1e293b" stroke-width="1.8" />

  <!-- Code Section (Live Animated Typing at a Natural, Relaxed Pace) -->
  <g transform="translate(10, 8)">
    <!-- Line Numbers -->
    <text x="32" y="88" class="line-num">1</text>
    <text x="32" y="126" class="line-num">2</text>
    <text x="32" y="164" class="line-num">3</text>
    <text x="32" y="202" class="line-num">4</text>
    <text x="32" y="240" class="line-num">5</text>

    <!-- Line 1: goal = "Success" -->
    <g clip-path="url(#clipLine1)">
      <text x="70" y="88" class="code-text">
        <tspan fill="#e5c07b" font-weight="700">goal</tspan> <tspan fill="#56b6c2">=</tspan> <tspan fill="#98c379">"Success"</tspan>
      </text>
    </g>

    <!-- Line 2: while goal != "achieved": -->
    <g clip-path="url(#clipLine2)">
      <text x="70" y="126" class="code-text">
        <tspan fill="#c678dd" font-weight="800">while</tspan> <tspan fill="#e5c07b" font-weight="700">goal</tspan> <tspan fill="#56b6c2">!=</tspan> <tspan fill="#98c379">"achieved"</tspan><tspan fill="#abb2bf">:</tspan>
      </text>
    </g>

    <!-- Line 3:     print("Learn. Build. Fail. Improve.") -->
    <g clip-path="url(#clipLine3)">
      <text x="70" y="164" class="code-text">
        <tspan fill="#abb2bf">&#160;&#160;&#160;&#160;</tspan><tspan fill="#61afef" font-weight="700">print</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"Learn. Build. Fail. Improve."</tspan><tspan fill="#abb2bf">)</tspan>
      </text>
    </g>

    <!-- Line 4:     goal = "achieved" -->
    <g clip-path="url(#clipLine4)">
      <text x="70" y="202" class="code-text">
        <tspan fill="#abb2bf">&#160;&#160;&#160;&#160;</tspan><tspan fill="#e5c07b" font-weight="700">goal</tspan> <tspan fill="#56b6c2">=</tspan> <tspan fill="#98c379">"achieved"</tspan>
      </text>
    </g>

    <!-- Line 5: print("Success isn't magic. It's consistency. 🚀") -->
    <g clip-path="url(#clipLine5)">
      <text x="70" y="240" class="code-text">
        <tspan fill="#61afef" font-weight="700">print</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"Success isn't magic. It's consistency. 🚀"</tspan><tspan fill="#abb2bf">)</tspan>
      </text>
    </g>
  </g>

  <!-- Terminal Divider -->
  <line x1="2" y1="272" x2="798" y2="272" stroke="#1e293b" stroke-width="1.8" />

  <!-- Output Terminal Box (Always Visible Screen, Output Slides In from Top to Down) -->
  <g>
    <!-- Terminal Screen Background -->
    <rect x="24" y="290" width="752" height="175" rx="12" fill="#060911" stroke="#1e293b" stroke-width="1.5" />

    <!-- Terminal Status Bar -->
    <g transform="translate(44, 318)">
      <text font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#64748b" letter-spacing="1">
        TERMINAL OUTPUT
      </text>
    </g>

    <!-- Output Line 1: Output: Learn. Build. Fail. Improve. (Nested group for smooth slide-down) -->
    <g transform="translate(44, 355)">
      <g class="anim-out-1">
        <text class="output-font" font-size="18" font-weight="700">
          <tspan fill="#38bdf8" font-weight="800">Output: </tspan>
          <tspan fill="#f8fafc">Learn. Build. Fail. Improve.</tspan>
        </text>
      </g>
    </g>

    <!-- Output Line 2: Success isn't magic. It's consistency. 🚀 (Nested group for smooth slide-down) -->
    <g transform="translate(44, 400)">
      <g class="anim-out-2">
        <text class="output-font" font-size="18.5" font-weight="800" fill="#4ade80">
          Success isn't magic. It's consistency. 🚀
        </text>
      </g>
    </g>

    <!-- Active Terminal Blinking Prompt Cursor -->
    <rect x="44" y="425" width="10" height="18" rx="2" class="cursor" />
  </g>
</svg>
