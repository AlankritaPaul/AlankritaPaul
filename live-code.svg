<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ideBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Clip Paths for Live Typing Effect -->
    <clipPath id="clipLine1">
      <rect x="58" y="55" width="560" height="30" class="type-clip-1" />
    </clipPath>
    <clipPath id="clipLine2">
      <rect x="58" y="85" width="560" height="30" class="type-clip-2" />
    </clipPath>
    <clipPath id="clipLine3">
      <rect x="58" y="115" width="560" height="30" class="type-clip-3" />
    </clipPath>
    <clipPath id="clipLine4">
      <rect x="58" y="145" width="560" height="30" class="type-clip-4" />
    </clipPath>
    <clipPath id="clipLine5">
      <rect x="58" y="175" width="560" height="30" class="type-clip-5" />
    </clipPath>

    <filter id="ideGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <style><![CDATA[
    .code-text {
      font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      font-size: 14.5px;
      letter-spacing: 0.5px;
    }
    .line-num {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      fill: #475569;
      user-select: none;
    }

    /* 16s Total Animation Cycle */
    @keyframes type1 {
      0%, 3% { transform: scaleX(0); }
      11%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type2 {
      0%, 14% { transform: scaleX(0); }
      22%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type3 {
      0%, 25% { transform: scaleX(0); }
      35%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type4 {
      0%, 38% { transform: scaleX(0); }
      46%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }
    @keyframes type5 {
      0%, 49% { transform: scaleX(0); }
      60%, 93% { transform: scaleX(1); }
      97%, 100% { transform: scaleX(0); }
    }

    .type-clip-1 { transform-origin: 58px 0; animation: type1 16s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-clip-2 { transform-origin: 58px 0; animation: type2 16s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-clip-3 { transform-origin: 58px 0; animation: type3 16s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-clip-4 { transform-origin: 58px 0; animation: type4 16s infinite cubic-bezier(0.3, 0, 0.2, 1); }
    .type-clip-5 { transform-origin: 58px 0; animation: type5 16s infinite cubic-bezier(0.3, 0, 0.2, 1); }

    /* Terminal Output: Up-to-Down Slide In */
    @keyframes slideDownOutSection {
      0%, 63% { opacity: 0; transform: translateY(-10px); }
      67%, 93% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes slideDownLine1 {
      0%, 67% { opacity: 0; transform: translateY(-12px); }
      71%, 93% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes slideDownLine2 {
      0%, 75% { opacity: 0; transform: translateY(-12px); }
      79%, 93% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-12px); }
    }

    .output-section { animation: slideDownOutSection 16s infinite ease-out; }
    .out-line-1 { animation: slideDownLine1 16s infinite ease-out; }
    .out-line-2 { animation: slideDownLine2 16s infinite ease-out; }

    /* Blinking Cursor */
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blinkCursor 0.8s infinite;
      fill: #38bdf8;
    }
  ]]></style>

  <!-- Editor Window Container -->
  <rect x="2" y="2" width="676" height="396" rx="16" fill="url(#ideBg)" stroke="url(#ideBorder)" stroke-width="2" filter="url(#ideGlow)" />

  <!-- Window Header / Tabs -->
  <g>
    <!-- macOS Dots -->
    <circle cx="28" cy="24" r="6" fill="#f43f5e" />
    <circle cx="48" cy="24" r="6" fill="#fbbf24" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <!-- Active Tab -->
    <rect x="96" y="10" width="120" height="28" rx="6" fill="#1e293b" />
    <circle cx="112" cy="24" r="3.5" fill="#38bdf8" />
    <text x="124" y="28" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#e2e8f0">main.py</text>

    <!-- Header Status Indicator -->
    <text x="635" y="27" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">PYTHON 3.11</text>
  </g>

  <!-- Header Divider Line -->
  <line x1="2" y1="46" x2="678" y2="46" stroke="#1e293b" stroke-width="1.5" />

  <!-- Code Section -->
  <g transform="translate(10, 5)">
    <!-- Line Numbers -->
    <text x="25" y="75" class="line-num">1</text>
    <text x="25" y="105" class="line-num">2</text>
    <text x="25" y="135" class="line-num">3</text>
    <text x="25" y="165" class="line-num">4</text>
    <text x="25" y="195" class="line-num">5</text>

    <!-- Line 1: goal = "Success" -->
    <g clip-path="url(#clipLine1)">
      <text x="60" y="75" class="code-text">
        <tspan fill="#e5c07b">goal</tspan> <tspan fill="#56b6c2">=</tspan> <tspan fill="#98c379">"Success"</tspan>
      </text>
    </g>

    <!-- Line 2: while goal != "achieved": -->
    <g clip-path="url(#clipLine2)">
      <text x="60" y="105" class="code-text">
        <tspan fill="#c678dd" font-weight="700">while</tspan> <tspan fill="#e5c07b">goal</tspan> <tspan fill="#56b6c2">!=</tspan> <tspan fill="#98c379">"achieved"</tspan><tspan fill="#abb2bf">:</tspan>
      </text>
    </g>

    <!-- Line 3:     print("Learn. Build. Fail. Improve.") -->
    <g clip-path="url(#clipLine3)">
      <text x="60" y="135" class="code-text">
        <tspan fill="#abb2bf">&#160;&#160;&#160;&#160;</tspan><tspan fill="#61afef">print</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"Learn. Build. Fail. Improve."</tspan><tspan fill="#abb2bf">)</tspan>
      </text>
    </g>

    <!-- Line 4:     goal = "achieved" -->
    <g clip-path="url(#clipLine4)">
      <text x="60" y="165" class="code-text">
        <tspan fill="#abb2bf">&#160;&#160;&#160;&#160;</tspan><tspan fill="#e5c07b">goal</tspan> <tspan fill="#56b6c2">=</tspan> <tspan fill="#98c379">"achieved"</tspan>
      </text>
    </g>

    <!-- Line 5: print("Success isn't magic. It's consistency. 🚀") -->
    <g clip-path="url(#clipLine5)">
      <text x="60" y="195" class="code-text">
        <tspan fill="#61afef">print</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"Success isn't magic. It's consistency. 🚀"</tspan><tspan fill="#abb2bf">)</tspan>
      </text>
    </g>
  </g>

  <!-- Terminal Divider -->
  <line x1="2" y1="225" x2="678" y2="225" stroke="#1e293b" stroke-width="1.5" />

  <!-- Output Terminal Area (Up to Down Animated) -->
  <g class="output-section">
    <!-- Terminal Tab Bar -->
    <rect x="22" y="240" width="636" height="138" rx="10" fill="#080c14" stroke="#1e293b" stroke-width="1" />
    
    <!-- Output Status Header -->
    <g transform="translate(36, 260)">
      <text font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8">
        ❯ Output:
      </text>
    </g>

    <!-- Output Line 1 (Up to down slide) -->
    <g class="out-line-1" transform="translate(36, 292)">
      <text font-family="'Fira Code', monospace" font-size="14" font-weight="600" fill="#f1f5f9">
        Learn. Build. Fail. Improve.
      </text>
    </g>

    <!-- Output Line 2 (Up to down slide) -->
    <g class="out-line-2" transform="translate(36, 326)">
      <text font-family="'Fira Code', monospace" font-size="14.5" font-weight="700" fill="#4ade80">
        Success isn't magic. It's consistency. 🚀
      </text>
    </g>

    <!-- Active Terminal Blinking Prompt Cursor -->
    <rect x="36" y="348" width="8" height="14" rx="2" class="cursor" />
  </g>
</svg>
