<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowAlpha" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowBeta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWinGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWinPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #cbd5e1;
      letter-spacing: 2px;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0.85;
    }
    
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulseLive 1.5s infinite ease-in-out;
      transform-origin: 595px 32px;
    }

    /* Total Cycle: 24s (Game 1: Alpha Wins [0-12s] | Game 2: Beta Wins [12-24s]) */
    
    /* ===== GAME 1 (0s to 12s) -> ALPHA WINS ===== */
    /* G1 Move 1: Alpha Center (x=340, y=260) */
    @keyframes g1_m1 {
      0%, 4% { opacity: 0; transform: scale(0.2); }
      6%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 2: Beta Top-Right (x=450, y=150) */
    @keyframes g1_m2 {
      0%, 10% { opacity: 0; transform: scale(0.2); }
      12%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 3: Alpha Top-Left (x=230, y=150) */
    @keyframes g1_m3 {
      0%, 16% { opacity: 0; transform: scale(0.2); }
      18%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 4: Beta Bottom-Right (x=450, y=370) */
    @keyframes g1_m4 {
      0%, 22% { opacity: 0; transform: scale(0.2); }
      24%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 5: Alpha Mid-Left (x=230, y=260) */
    @keyframes g1_m5 {
      0%, 28% { opacity: 0; transform: scale(0.2); }
      30%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 6: Beta Top-Mid (x=340, y=150) */
    @keyframes g1_m6 {
      0%, 34% { opacity: 0; transform: scale(0.2); }
      36%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 7: Alpha Bottom-Left (x=230, y=370) -> WINNER ALPHA! */
    @keyframes g1_m7 {
      0%, 40% { opacity: 0; transform: scale(0.2); }
      42%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Strike Line (Left column: x=230) */
    @keyframes g1_strike {
      0%, 42% { stroke-dashoffset: 300; opacity: 0; }
      43.5%, 46% { stroke-dashoffset: 0; opacity: 1; }
      48%, 100% { stroke-dashoffset: 300; opacity: 0; }
    }
    /* G1 Winner Banner (Alpha Wins) */
    @keyframes g1_banner {
      0%, 43% { opacity: 0; transform: translateY(12px) scale(0.9); }
      44%, 46.5% { opacity: 1; transform: translateY(0) scale(1); }
      48%, 100% { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }

    /* ===== GAME 2 (12s to 24s) -> BETA WINS ===== */
    /* G2 Move 1: Alpha Top-Left (x=230, y=150) */
    @keyframes g2_m1 {
      0%, 52% { opacity: 0; transform: scale(0.2); }
      54%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 2: Beta Center (x=340, y=260) */
    @keyframes g2_m2 {
      0%, 58% { opacity: 0; transform: scale(0.2); }
      60%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 3: Alpha Bottom-Right (x=450, y=370) */
    @keyframes g2_m3 {
      0%, 64% { opacity: 0; transform: scale(0.2); }
      66%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 4: Beta Top-Right (x=450, y=150) */
    @keyframes g2_m4 {
      0%, 70% { opacity: 0; transform: scale(0.2); }
      72%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 5: Alpha Mid-Right (x=450, y=260) */
    @keyframes g2_m5 {
      0%, 76% { opacity: 0; transform: scale(0.2); }
      78%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 6: Beta Bottom-Left (x=230, y=370) -> WINNER BETA (Diagonal: 450,150 to 230,370)! */
    @keyframes g2_m6 {
      0%, 82% { opacity: 0; transform: scale(0.2); }
      84%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Strike Line (Diagonal from 465,135 to 215,385) */
    @keyframes g2_strike {
      0%, 84% { stroke-dashoffset: 350; opacity: 0; }
      85.5%, 94.5% { stroke-dashoffset: 0; opacity: 1; }
      97%, 100% { stroke-dashoffset: 350; opacity: 0; }
    }
    /* G2 Winner Banner (Beta Wins) */
    @keyframes g2_banner {
      0%, 85% { opacity: 0; transform: translateY(12px) scale(0.9); }
      86%, 94.5% { opacity: 1; transform: translateY(0) scale(1); }
      97%, 100% { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }

    /* Assigning Keyframes */
    .g1-m1 { animation: g1_m1 24s infinite ease-out; transform-origin: 340px 260px; }
    .g1-m2 { animation: g1_m2 24s infinite ease-out; transform-origin: 450px 150px; }
    .g1-m3 { animation: g1_m3 24s infinite ease-out; transform-origin: 230px 150px; }
    .g1-m4 { animation: g1_m4 24s infinite ease-out; transform-origin: 450px 370px; }
    .g1-m5 { animation: g1_m5 24s infinite ease-out; transform-origin: 230px 260px; }
    .g1-m6 { animation: g1_m6 24s infinite ease-out; transform-origin: 340px 150px; }
    .g1-m7 { animation: g1_m7 24s infinite ease-out; transform-origin: 230px 370px; }
    .g1-strike { stroke-dasharray: 300; animation: g1_strike 24s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .g1-banner { animation: g1_banner 24s infinite cubic-bezier(0.16, 1, 0.3, 1); transform-origin: 340px 440px; }

    .g2-m1 { animation: g2_m1 24s infinite ease-out; transform-origin: 230px 150px; }
    .g2-m2 { animation: g2_m2 24s infinite ease-out; transform-origin: 340px 260px; }
    .g2-m3 { animation: g2_m3 24s infinite ease-out; transform-origin: 450px 370px; }
    .g2-m4 { animation: g2_m4 24s infinite ease-out; transform-origin: 450px 150px; }
    .g2-m5 { animation: g2_m5 24s infinite ease-out; transform-origin: 450px 260px; }
    .g2-m6 { animation: g2_m6 24s infinite ease-out; transform-origin: 230px 370px; }
    .g2-strike { stroke-dasharray: 350; animation: g2_strike 24s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .g2-banner { animation: g2_banner 24s infinite cubic-bezier(0.16, 1, 0.3, 1); transform-origin: 340px 440px; }
  ]]></style>

  <!-- Big Container Box -->
  <rect x="2" y="2" width="676" height="476" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Window Header -->
  <g>
    <circle cx="32" cy="32" r="7" fill="#f43f5e" />
    <circle cx="54" cy="32" r="7" fill="#fbbf24" />
    <circle cx="76" cy="32" r="7" fill="#10b981" />
    
    <text x="340" y="37" text-anchor="middle" class="terminal-title">🎮 LIVE MATCH : ALPHA VS BETA</text>
    
    <!-- Live Badge -->
    <circle cx="585" cy="32" r="4.5" fill="#ef4444" class="live-dot" />
    <text x="597" y="36" font-family="-apple-system, monospace" font-size="12" font-weight="800" fill="#ef4444" letter-spacing="1">LIVE</text>
  </g>

  <!-- Separator Header Line -->
  <line x1="2" y1="60" x2="678" y2="60" stroke="#1e293b" stroke-width="1.8" />

  <!-- Player Name Badges -->
  <g transform="translate(0, 15)">
    <!-- Player ALPHA (X) -->
    <rect x="60" y="62" width="160" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="84" font-family="-apple-system, monospace" font-size="14" font-weight="800" fill="#38bdf8">✕ PLAYER ALPHA</text>

    <!-- Center VS Badge -->
    <rect x="315" y="66" width="50" height="26" rx="13" fill="#1e293b" />
    <text x="340" y="83" text-anchor="middle" font-family="-apple-system, monospace" font-size="12" font-weight="900" fill="#94a3b8">VS</text>

    <!-- Player BETA (O) -->
    <rect x="460" y="62" width="160" height="34" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <text x="480" y="84" font-family="-apple-system, monospace" font-size="14" font-weight="800" fill="#f43f5e">◯ PLAYER BETA</text>
  </g>

  <!-- Expanded 3x3 Game Board Grid (Area: 175 to 505 horizontally, 100 to 420 vertically) -->
  <g>
    <!-- Vertical Lines -->
    <line x1="285" y1="105" x2="285" y2="415" class="grid-line" />
    <line x1="395" y1="105" x2="395" y2="415" class="grid-line" />

    <!-- Horizontal Lines -->
    <line x1="180" y1="205" x2="500" y2="205" class="grid-line" />
    <line x1="180" y1="315" x2="500" y2="315" class="grid-line" />
  </g>

  <!-- ==================== GAME 1 PIECES (ALPHA WINS) ==================== -->
  <!-- G1 Move 1: Alpha at Center (340, 260) -->
  <g class="g1-m1" filter="url(#glowAlpha)">
    <line x1="312" y1="232" x2="368" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="368" y1="232" x2="312" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G1 Move 2: Beta at Top-Right (450, 150) -->
  <g class="g1-m2" filter="url(#glowBeta)">
    <circle cx="450" cy="150" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G1 Move 3: Alpha at Top-Left (230, 150) -->
  <g class="g1-m3" filter="url(#glowAlpha)">
    <line x1="202" y1="122" x2="258" y2="178" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="122" x2="202" y2="178" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G1 Move 4: Beta at Bottom-Right (450, 370) -->
  <g class="g1-m4" filter="url(#glowBeta)">
    <circle cx="450" cy="370" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G1 Move 5: Alpha at Mid-Left (230, 260) -->
  <g class="g1-m5" filter="url(#glowAlpha)">
    <line x1="202" y1="232" x2="258" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="232" x2="202" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G1 Move 6: Beta at Top-Mid (340, 150) -->
  <g class="g1-m6" filter="url(#glowBeta)">
    <circle cx="340" cy="150" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G1 Move 7: Alpha at Bottom-Left (230, 370) - WINNING MOVE! -->
  <g class="g1-m7" filter="url(#glowAlpha)">
    <line x1="202" y1="342" x2="258" y2="398" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="342" x2="202" y2="398" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G1 Strike Line (Left column: x=230) -->
  <line x1="230" y1="110" x2="230" y2="410" stroke="#4ade80" stroke-width="8" stroke-linecap="round" class="g1-strike" filter="url(#glowWinGreen)" />

  <!-- G1 Winner Banner (ALPHA WINS) -->
  <g class="g1-banner" filter="url(#glowWinGreen)">
    <rect x="160" y="425" width="360" height="42" rx="21" fill="#022c22" stroke="#4ade80" stroke-width="2.5" />
    <text x="340" y="451" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#4ade80" letter-spacing="2">⚡ WINNER: PLAYER ALPHA ⚡</text>
  </g>

  <!-- ==================== GAME 2 PIECES (BETA WINS) ==================== -->
  <!-- G2 Move 1: Alpha at Top-Left (230, 150) -->
  <g class="g2-m1" filter="url(#glowAlpha)">
    <line x1="202" y1="122" x2="258" y2="178" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="122" x2="202" y2="178" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G2 Move 2: Beta at Center (340, 260) -->
  <g class="g2-m2" filter="url(#glowBeta)">
    <circle cx="340" cy="260" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G2 Move 3: Alpha at Bottom-Right (450, 370) -->
  <g class="g2-m3" filter="url(#glowAlpha)">
    <line x1="422" y1="342" x2="478" y2="398" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="478" y1="342" x2="422" y2="398" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G2 Move 4: Beta at Top-Right (450, 150) -->
  <g class="g2-m4" filter="url(#glowBeta)">
    <circle cx="450" cy="150" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G2 Move 5: Alpha at Mid-Right (450, 260) -->
  <g class="g2-m5" filter="url(#glowAlpha)">
    <line x1="422" y1="232" x2="478" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="478" y1="232" x2="422" y2="288" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- G2 Move 6: Beta at Bottom-Left (230, 370) - WINNING MOVE FOR BETA! (Diagonal: 450,150 -> 340,260 -> 230,370) -->
  <g class="g2-m6" filter="url(#glowBeta)">
    <circle cx="230" cy="370" r="30" fill="none" stroke="#f43f5e" stroke-width="7.5" />
  </g>

  <!-- G2 Strike Line (Diagonal from 460,140 to 220,380) -->
  <line x1="465" y1="135" x2="215" y2="385" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" class="g2-strike" filter="url(#glowWinPink)" />

  <!-- G2 Winner Banner (BETA WINS) -->
  <g class="g2-banner" filter="url(#glowWinPink)">
    <rect x="160" y="425" width="360" height="42" rx="21" fill="#3b0716" stroke="#f43f5e" stroke-width="2.5" />
    <text x="340" y="451" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#f43f5e" letter-spacing="2">🎉 WINNER: PLAYER BETA 🎉</text>
  </g>
</svg>
