<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowX" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowO" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 12px;
      font-weight: 500;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.8;
    }
    
    /* Animation Sequence (14s loop) */
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulseLive 1.5s infinite ease-in-out;
      transform-origin: 520px 30px;
    }

    /* Moves Timing */
    @keyframes animX1 { /* Move 1: Center */
      0%, 8% { opacity: 0; transform: scale(0.2); }
      12%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animO1 { /* Move 2: Top-Right */
      0%, 19% { opacity: 0; transform: scale(0.2); }
      23%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animX2 { /* Move 3: Top-Left */
      0%, 30% { opacity: 0; transform: scale(0.2); }
      34%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animO2 { /* Move 4: Bottom-Right */
      0%, 41% { opacity: 0; transform: scale(0.2); }
      45%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animX3 { /* Move 5: Middle-Left */
      0%, 52% { opacity: 0; transform: scale(0.2); }
      56%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animO3 { /* Move 6: Top-Middle */
      0%, 63% { opacity: 0; transform: scale(0.2); }
      67%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animX4 { /* Move 7: Bottom-Left (WINNING MOVE) */
      0%, 74% { opacity: 0; transform: scale(0.2); }
      78%, 92% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes animStrike {
      0%, 79% { stroke-dashoffset: 260; opacity: 0; }
      82%, 92% { stroke-dashoffset: 0; opacity: 1; }
      96%, 100% { stroke-dashoffset: 260; opacity: 0; }
    }
    @keyframes animBanner {
      0%, 82% { opacity: 0; transform: translateY(10px) scale(0.9); }
      85%, 92% { opacity: 1; transform: translateY(0) scale(1); }
      96%, 100% { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }
    @keyframes animTurnText {
      0%, 10% { content: "Turn: X (AI Agent)"; }
      11%, 21% { content: "Turn: O (Challenger)"; }
      22%, 32% { content: "Turn: X (AI Agent)"; }
      33%, 43% { content: "Turn: O (Challenger)"; }
      44%, 54% { content: "Turn: X (AI Agent)"; }
      55%, 65% { content: "Turn: O (Challenger)"; }
      66%, 76% { content: "Turn: X (AI Agent)"; }
      77%, 100% { content: "Match Ended!"; }
    }

    .move-x1 { animation: animX1 14s infinite ease-out; transform-origin: 300px 235px; }
    .move-o1 { animation: animO1 14s infinite ease-out; transform-origin: 395px 140px; }
    .move-x2 { animation: animX2 14s infinite ease-out; transform-origin: 205px 140px; }
    .move-o2 { animation: animO2 14s infinite ease-out; transform-origin: 395px 330px; }
    .move-x3 { animation: animX3 14s infinite ease-out; transform-origin: 205px 235px; }
    .move-o3 { animation: animO3 14s infinite ease-out; transform-origin: 300px 140px; }
    .move-x4 { animation: animX4 14s infinite ease-out; transform-origin: 205px 330px; }
    
    .strike-line {
      stroke-dasharray: 260;
      animation: animStrike 14s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .winner-banner {
      animation: animBanner 14s infinite cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: 300px 388px;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="596" height="416" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Window Header -->
  <g>
    <circle cx="28" cy="28" r="6" fill="#f43f5e" />
    <circle cx="48" cy="28" r="6" fill="#fbbf24" />
    <circle cx="68" cy="28" r="6" fill="#10b981" />
    
    <text x="300" y="33" text-anchor="middle" class="terminal-title">🎮 LIVE AUTOPLAY : TIC-TAC-TOE</text>
    
    <!-- Live Badge -->
    <circle cx="515" cy="28" r="4" fill="#ef4444" class="live-dot" />
    <text x="525" y="32" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="1">LIVE</text>
  </g>

  <!-- Separator Header Line -->
  <line x1="2" y1="52" x2="598" y2="52" stroke="#1e293b" stroke-width="1.5" />

  <!-- Player Status Indicators -->
  <g transform="translate(0, 10)">
    <!-- Player X -->
    <rect x="50" y="58" width="130" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="65" y="78" font-family="-apple-system, monospace" font-size="13" font-weight="700" fill="#38bdf8">✕ PLAYER X</text>
    <text x="145" y="78" font-family="-apple-system, monospace" font-size="11" fill="#64748b">(AI)</text>

    <!-- Center VS -->
    <text x="300" y="78" text-anchor="middle" font-family="-apple-system, monospace" font-size="12" font-weight="800" fill="#475569">VS</text>

    <!-- Player O -->
    <rect x="420" y="58" width="130" height="30" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" />
    <text x="435" y="78" font-family="-apple-system, monospace" font-size="13" font-weight="700" fill="#f43f5e">◯ PLAYER O</text>
    <text x="515" y="78" font-family="-apple-system, monospace" font-size="11" fill="#64748b">(BOT)</text>
  </g>

  <!-- Game Board Grid (Area: 160 to 440 horizontally, 90 to 370 vertically) -->
  <g>
    <!-- Vertical Lines -->
    <line x1="250" y1="105" x2="250" y2="365" class="grid-line" />
    <line x1="350" y1="105" x2="350" y2="365" class="grid-line" />

    <!-- Horizontal Lines -->
    <line x1="165" y1="190" x2="435" y2="190" class="grid-line" />
    <line x1="165" y1="280" x2="435" y2="280" class="grid-line" />
  </g>

  <!-- Pieces on Board -->
  <!-- Move 1: X in Center (300, 235) -->
  <g class="move-x1" filter="url(#glowX)">
    <line x1="275" y1="210" x2="325" y2="260" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <line x1="325" y1="210" x2="275" y2="260" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Move 2: O in Top-Right (395, 140) -->
  <g class="move-o1" filter="url(#glowO)">
    <circle cx="395" cy="140" r="26" fill="none" stroke="#f43f5e" stroke-width="6.5" />
  </g>

  <!-- Move 3: X in Top-Left (205, 140) -->
  <g class="move-x2" filter="url(#glowX)">
    <line x1="180" y1="115" x2="230" y2="165" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <line x1="230" y1="115" x2="180" y2="165" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Move 4: O in Bottom-Right (395, 330) -->
  <g class="move-o2" filter="url(#glowO)">
    <circle cx="395" cy="330" r="26" fill="none" stroke="#f43f5e" stroke-width="6.5" />
  </g>

  <!-- Move 5: X in Middle-Left (205, 235) -->
  <g class="move-x3" filter="url(#glowX)">
    <line x1="180" y1="210" x2="230" y2="260" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <line x1="230" y1="210" x2="180" y2="260" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Move 6: O in Top-Middle (300, 140) -->
  <g class="move-o3" filter="url(#glowO)">
    <circle cx="300" cy="140" r="26" fill="none" stroke="#f43f5e" stroke-width="6.5" />
  </g>

  <!-- Move 7: X in Bottom-Left (205, 330) - WINNING MOVE! -->
  <g class="move-x4" filter="url(#glowX)">
    <line x1="180" y1="305" x2="230" y2="355" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <line x1="230" y1="305" x2="180" y2="355" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Winning Strike Line through Left Column (x=205, from y=105 to y=365) -->
  <line x1="205" y1="105" x2="205" y2="365" stroke="#4ade80" stroke-width="7" stroke-linecap="round" class="strike-line" filter="url(#glowWin)" />

  <!-- Winner Announcement Banner (Appears on win) -->
  <g class="winner-banner" filter="url(#glowWin)">
    <rect x="150" y="365" width="300" height="38" rx="19" fill="#022c22" stroke="#4ade80" stroke-width="2" />
    <text x="300" y="389" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#4ade80" letter-spacing="1.5">⚡ WINNER: PLAYER X ⚡</text>
  </g>
</svg>
