<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="560">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowAlpha" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowBeta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWinGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowWinPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 16px;
      font-weight: 800;
      fill: #e2e8f0;
      letter-spacing: 2px;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.9;
    }
    
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulseLive 1.5s infinite ease-in-out;
      transform-origin: 715px 36px;
    }

    /* Total Cycle: 24s (Game 1: Alpha Wins [0-12s] | Game 2: Beta Wins [12-24s]) */
    
    /* ===== GAME 1 (0s to 12s) -> ALPHA WINS ===== */
    /* G1 Move 1: Alpha Center (x=400, y=305) */
    @keyframes g1_m1 {
      0%, 4% { opacity: 0; transform: scale(0.2); }
      6%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 2: Beta Top-Right (x=530, y=175) */
    @keyframes g1_m2 {
      0%, 10% { opacity: 0; transform: scale(0.2); }
      12%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 3: Alpha Top-Left (x=270, y=175) */
    @keyframes g1_m3 {
      0%, 16% { opacity: 0; transform: scale(0.2); }
      18%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 4: Beta Bottom-Right (x=530, y=435) */
    @keyframes g1_m4 {
      0%, 22% { opacity: 0; transform: scale(0.2); }
      24%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 5: Alpha Mid-Left (x=270, y=305) */
    @keyframes g1_m5 {
      0%, 28% { opacity: 0; transform: scale(0.2); }
      30%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 6: Beta Top-Mid (x=400, y=175) */
    @keyframes g1_m6 {
      0%, 34% { opacity: 0; transform: scale(0.2); }
      36%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Move 7: Alpha Bottom-Left (x=270, y=435) -> WINNER ALPHA! */
    @keyframes g1_m7 {
      0%, 40% { opacity: 0; transform: scale(0.2); }
      42%, 45% { opacity: 1; transform: scale(1); }
      48%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G1 Strike Line (Left column: x=270) */
    @keyframes g1_strike {
      0%, 42% { stroke-dashoffset: 360; opacity: 0; }
      43.5%, 46% { stroke-dashoffset: 0; opacity: 1; }
      48%, 100% { stroke-dashoffset: 360; opacity: 0; }
    }
    /* G1 Winner Banner (Alpha Wins) */
    @keyframes g1_banner {
      0%, 43% { opacity: 0; transform: translateY(12px) scale(0.9); }
      44%, 46.5% { opacity: 1; transform: translateY(0) scale(1); }
      48%, 100% { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }

    /* ===== GAME 2 (12s to 24s) -> BETA WINS ===== */
    /* G2 Move 1: Alpha Top-Left (x=270, y=175) */
    @keyframes g2_m1 {
      0%, 52% { opacity: 0; transform: scale(0.2); }
      54%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 2: Beta Center (x=400, y=305) */
    @keyframes g2_m2 {
      0%, 58% { opacity: 0; transform: scale(0.2); }
      60%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 3: Alpha Bottom-Right (x=530, y=435) */
    @keyframes g2_m3 {
      0%, 64% { opacity: 0; transform: scale(0.2); }
      66%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 4: Beta Top-Right (x=530, y=175) */
    @keyframes g2_m4 {
      0%, 70% { opacity: 0; transform: scale(0.2); }
      72%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 5: Alpha Mid-Right (x=530, y=305) */
    @keyframes g2_m5 {
      0%, 76% { opacity: 0; transform: scale(0.2); }
      78%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Move 6: Beta Bottom-Left (x=270, y=435) -> WINNER BETA (Diagonal: 530,175 -> 400,305 -> 270,435) */
    @keyframes g2_m6 {
      0%, 82% { opacity: 0; transform: scale(0.2); }
      84%, 94% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(0.2); }
    }
    /* G2 Strike Line (Diagonal from 550,155 to 250,455) */
    @keyframes g2_strike {
      0%, 84% { stroke-dashoffset: 420; opacity: 0; }
      85.5%, 94.5% { stroke-dashoffset: 0; opacity: 1; }
      97%, 100% { stroke-dashoffset: 420; opacity: 0; }
    }
    /* G2 Winner Banner (Beta Wins) */
    @keyframes g2_banner {
      0%, 85% { opacity: 0; transform: translateY(12px) scale(0.9); }
      86%, 94.5% { opacity: 1; transform: translateY(0) scale(1); }
      97%, 100% { opacity: 0; transform: translateY(-10px) scale(0.9); }
    }

    /* Assigning Keyframes */
    .g1-m1 { animation: g1_m1 24s infinite ease-out; transform-origin: 400px 305px; }
    .g1-m2 { animation: g1_m2 24s infinite ease-out; transform-origin: 530px 175px; }
    .g1-m3 { animation: g1_m3 24s infinite ease-out; transform-origin: 270px 175px; }
    .g1-m4 { animation: g1_m4 24s infinite ease-out; transform-origin: 530px 435px; }
    .g1-m5 { animation: g1_m5 24s infinite ease-out; transform-origin: 270px 305px; }
    .g1-m6 { animation: g1_m6 24s infinite ease-out; transform-origin: 400px 175px; }
    .g1-m7 { animation: g1_m7 24s infinite ease-out; transform-origin: 270px 435px; }
    .g1-strike { stroke-dasharray: 360; animation: g1_strike 24s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .g1-banner { animation: g1_banner 24s infinite cubic-bezier(0.16, 1, 0.3, 1); transform-origin: 400px 505px; }

    .g2-m1 { animation: g2_m1 24s infinite ease-out; transform-origin: 270px 175px; }
    .g2-m2 { animation: g2_m2 24s infinite ease-out; transform-origin: 400px 305px; }
    .g2-m3 { animation: g2_m3 24s infinite ease-out; transform-origin: 530px 435px; }
    .g2-m4 { animation: g2_m4 24s infinite ease-out; transform-origin: 530px 175px; }
    .g2-m5 { animation: g2_m5 24s infinite ease-out; transform-origin: 530px 305px; }
    .g2-m6 { animation: g2_m6 24s infinite ease-out; transform-origin: 270px 435px; }
    .g2-strike { stroke-dasharray: 420; animation: g2_strike 24s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .g2-banner { animation: g2_banner 24s infinite cubic-bezier(0.16, 1, 0.3, 1); transform-origin: 400px 505px; }
  ]]></style>

  <!-- Big Container Box -->
  <rect x="2" y="2" width="796" height="556" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Window Header -->
  <g>
    <circle cx="36" cy="36" r="8" fill="#f43f5e" />
    <circle cx="62" cy="36" r="8" fill="#fbbf24" />
    <circle cx="88" cy="36" r="8" fill="#10b981" />
    
    <text x="400" y="42" text-anchor="middle" class="terminal-title">🎮 LIVE MATCH : ALPHA VS BETA</text>
    
    <!-- Live Badge -->
    <circle cx="705" cy="36" r="5" fill="#ef4444" class="live-dot" />
    <text x="718" y="41" font-family="-apple-system, monospace" font-size="13" font-weight="900" fill="#ef4444" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Separator Header Line -->
  <line x1="2" y1="68" x2="798" y2="68" stroke="#1e293b" stroke-width="2" />

  <!-- Player Name Badges (Bigger, Bolder) -->
  <g transform="translate(0, 15)">
    <!-- Player ALPHA (X) -->
    <rect x="70" y="70" width="190" height="40" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <text x="95" y="96" font-family="-apple-system, monospace" font-size="16" font-weight="900" fill="#38bdf8">✕ PLAYER ALPHA</text>

    <!-- Center VS Badge -->
    <rect x="370" y="74" width="60" height="32" rx="16" fill="#1e293b" />
    <text x="400" y="95" text-anchor="middle" font-family="-apple-system, monospace" font-size="14" font-weight="900" fill="#94a3b8">VS</text>

    <!-- Player BETA (O) -->
    <rect x="540" y="70" width="190" height="40" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8" />
    <text x="565" y="96" font-family="-apple-system, monospace" font-size="16" font-weight="900" fill="#f43f5e">◯ PLAYER BETA</text>
  </g>

  <!-- Expanded 3x3 Game Board Grid -->
  <g>
    <!-- Vertical Lines -->
    <line x1="335" y1="120" x2="335" y2="490" class="grid-line" />
    <line x1="465" y1="120" x2="465" y2="490" class="grid-line" />

    <!-- Horizontal Lines -->
    <line x1="210" y1="240" x2="590" y2="240" class="grid-line" />
    <line x1="210" y1="370" x2="590" y2="370" class="grid-line" />
  </g>

  <!-- ==================== GAME 1 PIECES (ALPHA WINS) ==================== -->
  <!-- G1 Move 1: Alpha at Center (400, 305) -->
  <g class="g1-m1" filter="url(#glowAlpha)">
    <line x1="365" y1="270" x2="435" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="435" y1="270" x2="365" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G1 Move 2: Beta at Top-Right (530, 175) -->
  <g class="g1-m2" filter="url(#glowBeta)">
    <circle cx="530" cy="175" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G1 Move 3: Alpha at Top-Left (270, 175) -->
  <g class="g1-m3" filter="url(#glowAlpha)">
    <line x1="235" y1="140" x2="305" y2="210" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="305" y1="140" x2="235" y2="210" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G1 Move 4: Beta at Bottom-Right (530, 435) -->
  <g class="g1-m4" filter="url(#glowBeta)">
    <circle cx="530" cy="435" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G1 Move 5: Alpha at Mid-Left (270, 305) -->
  <g class="g1-m5" filter="url(#glowAlpha)">
    <line x1="235" y1="270" x2="305" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="305" y1="270" x2="235" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G1 Move 6: Beta at Top-Mid (400, 175) -->
  <g class="g1-m6" filter="url(#glowBeta)">
    <circle cx="400" cy="175" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G1 Move 7: Alpha at Bottom-Left (270, 435) - WINNING MOVE! -->
  <g class="g1-m7" filter="url(#glowAlpha)">
    <line x1="235" y1="400" x2="305" y2="470" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="305" y1="400" x2="235" y2="470" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G1 Strike Line (Left column: x=270) -->
  <line x1="270" y1="130" x2="270" y2="480" stroke="#4ade80" stroke-width="9.5" stroke-linecap="round" class="g1-strike" filter="url(#glowWinGreen)" />

  <!-- G1 Winner Banner (ALPHA WINS) -->
  <g class="g1-banner" filter="url(#glowWinGreen)">
    <rect x="190" y="495" width="420" height="48" rx="24" fill="#022c22" stroke="#4ade80" stroke-width="2.8" />
    <text x="400" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#4ade80" letter-spacing="2">⚡ WINNER: PLAYER ALPHA ⚡</text>
  </g>

  <!-- ==================== GAME 2 PIECES (BETA WINS) ==================== -->
  <!-- G2 Move 1: Alpha at Top-Left (270, 175) -->
  <g class="g2-m1" filter="url(#glowAlpha)">
    <line x1="235" y1="140" x2="305" y2="210" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="305" y1="140" x2="235" y2="210" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G2 Move 2: Beta at Center (400, 305) -->
  <g class="g2-m2" filter="url(#glowBeta)">
    <circle cx="400" cy="305" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G2 Move 3: Alpha at Bottom-Right (530, 435) -->
  <g class="g2-m3" filter="url(#glowAlpha)">
    <line x1="495" y1="400" x2="565" y2="470" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="565" y1="400" x2="495" y2="470" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G2 Move 4: Beta at Top-Right (530, 175) -->
  <g class="g2-m4" filter="url(#glowBeta)">
    <circle cx="530" cy="175" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G2 Move 5: Alpha at Mid-Right (530, 305) -->
  <g class="g2-m5" filter="url(#glowAlpha)">
    <line x1="495" y1="270" x2="565" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
    <line x1="565" y1="270" x2="495" y2="340" stroke="#38bdf8" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- G2 Move 6: Beta at Bottom-Left (270, 435) - WINNING MOVE FOR BETA! (Diagonal: 530,175 -> 400,305 -> 270,435) -->
  <g class="g2-m6" filter="url(#glowBeta)">
    <circle cx="270" cy="435" r="36" fill="none" stroke="#f43f5e" stroke-width="9" />
  </g>

  <!-- G2 Strike Line (Diagonal from 550,155 to 250,455) -->
  <line x1="550" y1="155" x2="250" y2="455" stroke="#f43f5e" stroke-width="9.5" stroke-linecap="round" class="g2-strike" filter="url(#glowWinPink)" />

  <!-- G2 Winner Banner (BETA WINS) -->
  <g class="g2-banner" filter="url(#glowWinPink)">
    <rect x="190" y="495" width="420" height="48" rx="24" fill="#3b0716" stroke="#f43f5e" stroke-width="2.8" />
    <text x="400" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f43f5e" letter-spacing="2">🎉 WINNER: PLAYER BETA 🎉</text>
  </g>
</svg>
